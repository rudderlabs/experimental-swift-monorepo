name: Recover (complete reviewed experimental publications)
# The Recover button (D20): manual, no inputs, every run scans all packages.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experimental-publication-recovery
  cancel-in-progress: false
jobs:
  pending:
    if: github.repository == 'rudderlabs/experimental-swift-monorepo' && vars.EXPERIMENTAL_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Discover incomplete source component releases
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publication_queue.py
      - name: Fail on broken items after the others are queued
        if: steps.plan.outputs.broken == 'true'
        run: |
          echo "Some items are incomplete; see the annotations. The other packages still complete."
          exit 1
  complete:
    name: publish (${{ matrix.package }})
    needs: pending
    # A broken item fails the pending job but never blocks the others.
    if: ${{ !cancelled() && needs.pending.outputs.pending == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.pending.outputs.matrix) }}
    uses: ./.github/workflows/publish.yml
    with:
      package: ${{ matrix.package }}
      version: ${{ matrix.version }}
      source_sha: ${{ matrix.source_sha }}
    secrets:
      RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
