name: Validate experimental source
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 scripts/release_plan.py sync-shared --check
      - run: python3 scripts/dependency_policy.py check
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
        env:
          RUN_SWIFT_BUILD_TESTS: "1"
      - run: python3 -m compileall -q scripts
