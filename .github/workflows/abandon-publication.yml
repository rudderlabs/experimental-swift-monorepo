name: Abandon Unpublished Version
# The one way to discard a version that has no public tag; the next release of the package gets the same number.
# Public side: the publish PR is closed (or, if merged, first reverted by a bot PR: merge it and run this again) and
# marked discarded. Monorepo side: a rollback PR reverts the release commit; merge it next. A tagged version is
# refused: roll forward. See docs/reviewed-publication/README.md, "Discard an unpublished version".
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package whose unpublished version you want to discard
        type: choice
        required: true
        options: # Generated by scripts/generate_github.py
          - swift-sdk
          - sprig
          - firebase
      version:
        description: Version to discard (it has no public tag yet), e.g. 1.4.3
        type: string
        required: true
permissions:
  contents: read
jobs:
  public:
    if: github.repository == 'rudderlabs/experimental-swift-monorepo' && vars.EXPERIMENTAL_RELEASES_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: experimental-spm-release
    # The publish.yml group: never races a publication of the same package.
    concurrency:
      group: experimental-publication-${{ inputs.package }}
      cancel-in-progress: false
    outputs:
      proceed: ${{ steps.discard.outputs.proceed }}
      branch: ${{ steps.discard.outputs.branch }}
      repository: ${{ steps.preflight.outputs.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Tags and maintenance branches: the version's monorepo tag decides its line and public base.
          fetch-depth: 0
          persist-credentials: false
      - name: Validate allowlisted package
        id: preflight
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'scripts')
          from common import allowlist
          names = allowlist()
          if os.environ['PACKAGE'] not in names:
              raise SystemExit('Invalid package')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('repository=' + names[os.environ['PACKAGE']] + '\n')
          PYCODE
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: ${{ steps.preflight.outputs.repository }},experimental-swift-monorepo
          permission-contents: write
          permission-pull-requests: write
      - name: Configure publication bot identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          id="$(gh api '/users/rudderstack-github-actions%5Bbot%5D' --jq .id)"
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "Bot user id lookup failed"; exit 1; }
          git config --global user.name "rudderstack-github-actions[bot]"
          git config --global user.email "${id}+rudderstack-github-actions[bot]@users.noreply.github.com"
      - name: Check, then discard the public publish PR
        id: discard
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          python3 scripts/discard_version.py public "$PACKAGE" "$VERSION"
  rollback:
    needs: public
    if: needs.public.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: experimental-spm-release
    # The release-please.yml group of the version's line: queues behind a Release Please run there.
    concurrency:
      group: experimental-release-please-${{ needs.public.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: ${{ needs.public.outputs.repository }},experimental-swift-monorepo
          permission-contents: write
          permission-pull-requests: write
      - name: Configure publication bot identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          id="$(gh api '/users/rudderstack-github-actions%5Bbot%5D' --jq .id)"
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "Bot user id lookup failed"; exit 1; }
          git config --global user.name "rudderstack-github-actions[bot]"
          git config --global user.email "${id}+rudderstack-github-actions[bot]@users.noreply.github.com"
      - name: Open the rollback PR, then delete the monorepo Release and tag
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          gh auth setup-git
          python3 scripts/discard_version.py rollback "$PACKAGE" "$VERSION"
