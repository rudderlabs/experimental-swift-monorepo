name: Validate experimental source
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  source:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - run: python3 scripts/release_plan.py sync-shared --check
      - run: python3 scripts/dependency_policy.py check
      - run: python3 -m unittest discover -s Tests -p 'test_*.py'
      - run: swift test
      - run: python3 -m compileall -q scripts
