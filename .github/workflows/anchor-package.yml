name: Set Current Release Version
# Record the version a package is already at, so the next release continues from it, e.g. after an import or a
# package-key rename (D21). It adds a plain git tag and no GitHub Release, so nothing is queued or published.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package whose current version you want to record
        type: choice
        required: true
        options: # Generated by scripts/generate_github.py
          - swift-sdk
          - sprig
          - firebase
      version:
        description: The version the package is already at, e.g. 1.0.0
        type: string
        required: true
      sha:
        description: Full 40-character SHA of the commit on main that has this version (e.g. the import merge)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: experimental-anchor
  cancel-in-progress: false
jobs:
  anchor:
    if: github.repository == 'rudderlabs/experimental-swift-monorepo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: experimental-spm-release
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package, version and main commit
        id: anchor
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: python3 scripts/anchor.py "$PACKAGE" "$VERSION" "$SHA"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: experimental-swift-monorepo
          permission-contents: write
      - name: Create the plain tag (no GitHub Release)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.anchor.outputs.tag }}
          SHA: ${{ inputs.sha }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"
