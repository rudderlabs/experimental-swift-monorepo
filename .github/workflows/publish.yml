name: Publish Package
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        required: true
        options: # Generated by scripts/generate_github.py
          - swift-sdk
          - sprig
          - firebase
      version:
        description: Released version to publish, e.g. 1.4.2
        type: string
        required: true
      source_sha:
        description: Full 40-character SHA of the released source commit (on main or its maintenance branch)
        type: string
        required: true
      mode:
        description: normal, unless it is the first release into an existing public repo (takeover) or a README-only repo (bootstrap)
        type: choice
        default: normal
        options:
          - normal
          - takeover
          - bootstrap
  workflow_call:
    secrets:
      RELEASE_PRIVATE_KEY:
        description: Private key for the existing publication GitHub App
        required: true
    inputs:
      package:
        type: string
        required: true
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      mode:
        type: string
        default: normal
    outputs:
      status:
        value: ${{ jobs.publish.outputs.status }}
      package:
        value: ${{ jobs.publish.outputs.package }}
      version:
        value: ${{ jobs.publish.outputs.version }}
      tag:
        value: ${{ jobs.publish.outputs.tag }}
      sourceCommit:
        value: ${{ jobs.publish.outputs.sourceCommit }}
      pullRequest:
        value: ${{ jobs.publish.outputs.pullRequest }}
      publicationCommit:
        value: ${{ jobs.publish.outputs.publicationCommit }}
permissions:
  contents: read
jobs:
  publish:
    # main, or Release Please on a pushed maintenance branch release/<key>-X.Y.x (the script validates the line).
    if: github.repository == 'rudderlabs/experimental-swift-monorepo' && vars.EXPERIMENTAL_RELEASES_ENABLED == 'true' && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')))
    outputs:
      status: ${{ steps.verified.outputs.status }}
      package: ${{ steps.verified.outputs.package }}
      version: ${{ steps.verified.outputs.version }}
      tag: ${{ steps.verified.outputs.tag }}
      sourceCommit: ${{ steps.verified.outputs.sourceCommit }}
      publicationCommit: ${{ steps.verified.outputs.publicationCommit }}
      pullRequest: ${{ steps.verified.outputs.pullRequest }}
    runs-on: macos-15
    environment: experimental-spm-release
    concurrency:
      group: experimental-publication-${{ inputs.package }}
      cancel-in-progress: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Checkout approved source snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_sha }}
          path: .lab/release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Validate allowlisted package and source ancestry
        id: preflight
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PYCODE'
          import os, re, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from common import allowlist, inventory
          from maintenance_branch import source_line
          from project import SEMVER
          key = os.environ['PACKAGE']
          sha = os.environ['SOURCE_SHA']
          version = os.environ['VERSION']
          names = allowlist()
          if key not in names or not re.fullmatch('[0-9a-f]{40}', sha) or not SEMVER.fullmatch(version):
              raise SystemExit('Invalid package, version or source SHA')
          if inventory(Path('.lab/release-source')).get(key, {}).get('repository') != names[key]:
              raise SystemExit('Package is not in the source inventory with its allowlisted repository')
          # On origin/main, or on origin/release/<key>-X.Y.x for the version's X.Y; anything else stops here.
          try:
              print('Source line: ' + source_line(Path('.lab/release-source'), key, sha, version))
          except ValueError as error:
              raise SystemExit(str(error))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('repository=' + names[key] + '\n')
          PYCODE
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          owner: rudderlabs
          repositories: ${{ steps.preflight.outputs.repository }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure publication bot identity
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          id="$(gh api '/users/rudderstack-github-actions%5Bbot%5D' --jq .id)"
          [[ "$id" =~ ^[1-9][0-9]*$ ]] || { echo "Bot user id lookup failed"; exit 1; }
          git config --global user.name "rudderstack-github-actions[bot]"
          git config --global user.email "${id}+rudderstack-github-actions[bot]@users.noreply.github.com"
      - name: Prepare reviewed publication or finalize merged package
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ENABLE_EXPERIMENTAL_PUBLICATION: 'true'
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          gh auth setup-git
          python3 scripts/publish.py "$PACKAGE" "$VERSION" --mode "$MODE" --source-root "$GITHUB_WORKSPACE/.lab/release-source" --result-file "$RUNNER_TEMP/publication-result.json"
      - name: Expose verified publication
        id: verified
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ['RUNNER_TEMP']) / 'publication-result.json').read_text())
          if result['status'] not in ('published', 'awaiting_review', 'awaiting_dependency', 'awaiting_takeover', 'abandoned'):
              raise SystemExit('Publication is incomplete')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('status', 'package', 'version', 'tag', 'sourceCommit', 'publicationCommit', 'pullRequest'):
                  output.write(key + '=' + result.get(key, '') + '\n')
              output.write('takeover=' + str(result.get('takeover', False)).lower() + '\n')
          PYCODE
      - name: Verify anonymous public customer upgrade
        if: steps.verified.outputs.status == 'published' && steps.verified.outputs.takeover != 'true'
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/verify_public_customer.py "$PACKAGE" "$VERSION" "$RUNNER_TEMP/customer-evidence" --source-root "$GITHUB_WORKSPACE/.lab/release-source"
      - name: Retain customer evidence
        if: always() && steps.verified.outputs.status == 'published' && steps.verified.outputs.takeover != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-${{ inputs.package }}-${{ inputs.version }}
          path: ${{ runner.temp }}/customer-evidence
      - name: Record job result for the batch status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          printf '{"result": "%s"}\n' "$JOB_STATUS" > "$RUNNER_TEMP/publication-job.json"
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ inputs.package }}-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/publication-result.json
            ${{ runner.temp }}/publication-job.json
